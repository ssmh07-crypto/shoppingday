name: 스마트스토어 대량 작업
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 확인 후 생성한 대량 작업 ID
        required: true
        type: string
concurrency:
  group: naver-bulk-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BULK_JOB_ID: ${{ inputs.job_id }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      DOME_API_ID: ${{ secrets.DOME_API_ID }}
      DOME_API_KEY: ${{ secrets.DOME_API_KEY }}
      NAVER_COMMERCE_RELAY_URL: ${{ secrets.NAVER_COMMERCE_RELAY_URL }}
      NAVER_COMMERCE_RELAY_SHARED_SECRET: ${{ secrets.NAVER_COMMERCE_RELAY_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm clean-install --progress=false
      - run: node --conditions=react-server --import tsx scripts/run-naver-bulk.ts
